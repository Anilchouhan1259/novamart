spring.application.name=ecommerce-backend
server.port=8080

# Default Database: Embedded Database (MySQL compatible mode)
# This allows the application to start immediately out of the box even if local MySQL is not running.
spring.datasource.url=jdbc:h2:mem:ecommerce_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# JWT Configuration
ecommerce.jwt.secret=EcommerceSuperSecretKeyMustBeAtLeast256BitsLongForHMACSHA256Security1234567890
ecommerce.jwt.expirationMs=86400000
